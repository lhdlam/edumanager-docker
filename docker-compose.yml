version: '3.8'

services:
  edumanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumanager_app
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      # Mount thư mục data để lưu database SQLite persistent
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
